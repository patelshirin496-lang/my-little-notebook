<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Little Notebook</title>

<!-- PWA / iPadOS Safari -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f9c6d7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Notebook">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">

<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;700&family=Pacifico&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --cream:#fff8ee; --white:#ffffff; --pink:#f9c6d7; --pink-d:#e58aa8;
  --lav:#d9ccf5; --lav-d:#8e79c9; --ink:#4a3f5c; --soft:#7b6f8c;
  --shadow:0 8px 24px rgba(142,121,201,.18);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --cream:#2a2433; --white:#383046; --pink:#6b3f55; --pink-d:#f3a3bf;
    --lav:#4c4170; --lav-d:#c9b9f5; --ink:#f6eefc; --soft:#c9bfd8;
    --shadow:0 8px 24px rgba(0,0,0,.35);
  }
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--cream);color:var(--ink);
  font-family:"Quicksand",system-ui,-apple-system,"Segoe UI",sans-serif;
  background-image:radial-gradient(circle at 12% 8%,var(--pink) 0,transparent 32%),
                   radial-gradient(circle at 92% 18%,var(--lav) 0,transparent 30%)}
main{max-width:980px;margin:0 auto;padding:32px 24px 130px}
header{text-align:center;margin-bottom:28px}
h1{font-family:"Pacifico","Brush Script MT",cursive;font-weight:400;
  font-size:clamp(2.4rem,7vw,3.8rem);margin:0 0 10px;color:var(--lav-d)}
.welcome{font-size:clamp(1rem,2.6vw,1.2rem);color:var(--soft);margin:0 auto;max-width:34em;line-height:1.6}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:26px 0 16px;flex-wrap:wrap}
h2{margin:0;font-size:1.3rem}
.btn{font:inherit;font-weight:700;border:0;border-radius:999px;padding:14px 26px;min-height:48px;cursor:pointer;
  background:var(--pink-d);color:#fff;box-shadow:var(--shadow);transition:transform .15s}
.btn:active{transform:scale(.96)}
.btn.ghost{background:var(--lav);color:var(--ink);box-shadow:none}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--lav-d);outline-offset:3px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
@media (min-width:1100px){.grid{grid-template-columns:repeat(4,1fr)}}
@media (max-width:480px){.grid{grid-template-columns:1fr}}
.card{font:inherit;color:inherit;text-align:left;border:0;cursor:pointer;background:var(--white);
  border-radius:26px;padding:22px;min-height:190px;display:flex;flex-direction:column;gap:8px;
  box-shadow:var(--shadow);border-top:10px solid var(--c);transition:transform .15s}
.card:active{transform:scale(.97)}
.icon{width:58px;height:58px;border-radius:18px;background:var(--c);display:grid;place-items:center;font-size:1.9rem}
.card h3{margin:8px 0 0;font-size:1.2rem}
.card p{margin:0;color:var(--soft);font-size:.95rem}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:6px;
  padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--white);
  border-top:2px solid var(--lav);z-index:20}
nav button{font:inherit;font-weight:700;flex:1;max-width:180px;min-height:56px;border:0;border-radius:18px;
  background:transparent;color:var(--soft);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
nav button span{font-size:1.4rem}
nav button small{font-size:.8rem}
nav button[aria-current="page"]{background:var(--lav);color:var(--ink)}
dialog{border:0;border-radius:26px;padding:26px;width:min(92vw,440px);max-height:86vh;overflow:auto;background:var(--white);color:var(--ink);box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(74,63,92,.4)}
dialog h2{margin-bottom:14px}
label{font-weight:700;display:block;margin-bottom:6px}
input[type=text],textarea{font:inherit;width:100%;padding:14px;border-radius:14px;border:2px solid var(--lav);background:var(--cream);color:var(--ink)}
textarea{min-height:110px;resize:vertical}
.swatches{display:flex;gap:10px;margin:16px 0 22px}
.swatches button{width:44px;height:44px;border-radius:50%;border:3px solid transparent;cursor:pointer;background:var(--c)}
.swatches button[aria-pressed="true"]{border-color:var(--ink)}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:14px}
.notes{list-style:none;margin:0 0 18px;padding:0;display:grid;gap:10px}
.note{background:var(--cream);border-left:6px solid var(--c);border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
.note div{flex:1;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}
.note small{display:block;color:var(--soft);margin-top:4px}
.note button{border:0;background:transparent;font-size:1.2rem;cursor:pointer;min-width:44px;min-height:44px}
.empty{color:var(--soft);text-align:center;padding:14px 0}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;
  background:var(--ink);color:var(--cream);padding:12px 20px;border-radius:999px;transition:.25s;z-index:30;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <header>
    <h1>My Little Notebook</h1>
    <p class="welcome">Welcome back! 🌸 A cozy little place for your classes, thoughts and plans. Pick a notebook to begin.</p>
  </header>
  <div class="bar">
    <h2>Your notebooks</h2>
    <button class="btn" id="newBtn">＋ Create New Notebook</button>
  </div>
  <section class="grid" id="grid" aria-label="Notebooks"></section>
</main>

<nav aria-label="Main navigation" id="nav">
  <button data-page="Home" aria-current="page"><span>🏠</span><small>Home</small></button>
  <button data-page="Notebooks"><span>📓</span><small>Notebooks</small></button>
  <button data-page="Planner"><span>📅</span><small>Planner</small></button>
  <button data-page="Settings"><span>⚙️</span><small>Settings</small></button>
</nav>

<!-- Create notebook pop-up -->
<dialog id="dlg">
  <h2>New notebook</h2>
  <label for="nameInput">Notebook name</label>
  <input type="text" id="nameInput" maxlength="24" placeholder="e.g. Recipes">
  <div class="swatches" id="swatches" aria-label="Choose a colour"></div>
  <div class="actions">
    <button class="btn ghost" id="cancelBtn">Cancel</button>
    <button class="btn" id="saveBtn">Create notebook</button>
  </div>
</dialog>

<!-- Notes pop-up (opens when you tap a notebook card) -->
<dialog id="notesDlg">
  <h2 id="notesTitle"></h2>
  <ul class="notes" id="notesList"></ul>
  <label for="noteInput">New note</label>
  <textarea id="noteInput" placeholder="Write something…"></textarea>
  <div class="actions">
    <button class="btn ghost" id="closeNotes">Close</button>
    <button class="btn" id="addNote">Save note</button>
  </div>
</dialog>
<div id="toast" role="status"></div>

<script>
/* ---------- Small helpers ---------- */
var colors = ["#f9c6d7","#d9ccf5","#fde3b8","#cfeee4"];
var picked = colors[0];
var notebooks = [];
var counts = {};
var currentNb = null;

function toast(msg) {
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(function(){ t.classList.remove("show"); }, 2200);
}

/* ---------- IndexedDB (your notes live on this device) ---------- */
var db;
function openDB() {
  return new Promise(function(resolve, reject) {
    var req = indexedDB.open("my-little-notebook", 1);
    req.onupgradeneeded = function() {
      var d = req.result;
      d.createObjectStore("notebooks", {keyPath:"id", autoIncrement:true});
      var notes = d.createObjectStore("notes", {keyPath:"id", autoIncrement:true});
      notes.createIndex("notebookId", "notebookId");
      d.createObjectStore("meta", {keyPath:"key"});
    };
    req.onsuccess = function(){ resolve(req.result); };
    req.onerror = function(){ reject(req.error); };
  });
}
function run(store, mode, fn) {
  return new Promise(function(resolve, reject) {
    var tx = db.transaction(store, mode);
    var result = fn(tx.objectStore(store));
    tx.oncomplete = function(){ resolve(result && result.result !== undefined ? result.result : undefined); };
    tx.onerror = function(){ reject(tx.error); };
  });
}
function getAll(store) { return run(store, "readonly", function(s){ return s.getAll(); }); }
function add(store, value) { return run(store, "readwrite", function(s){ return s.add(value); }); }
function remove(store, id) { return run(store, "readwrite", function(s){ return s.delete(id); }); }
function notesFor(id) { return run("notes", "readonly", function(s){ return s.index("notebookId").getAll(id); }); }

async function seedIfFirstRun() {
  var done = await run("meta", "readonly", function(s){ return s.get("seeded"); });
  if (done) return;
  var starters = [
    {name:"College Notes", icon:"🎓", color:colors[0]},
    {name:"Personal Notes", icon:"💭", color:colors[1]},
    {name:"Important Notes", icon:"⭐", color:colors[2]},
    {name:"My Planner", icon:"🗓️", color:colors[3]}
  ];
  for (var i = 0; i < starters.length; i++) await add("notebooks", starters[i]);
  await add("meta", {key:"seeded", value:true});
}

async function refresh() {
  notebooks = await getAll("notebooks");
  var all = await getAll("notes");
  counts = {};
  all.forEach(function(n){ counts[n.notebookId] = (counts[n.notebookId] || 0) + 1; });
  render();
}

/* ---------- Dashboard cards ---------- */
function render() {
  var grid = document.getElementById("grid");
  grid.innerHTML = "";
  notebooks.forEach(function(nb) {
    var n = counts[nb.id] || 0;
    var b = document.createElement("button");
    b.className = "card";
    b.style.setProperty("--c", nb.color);
    var icon = document.createElement("div"); icon.className = "icon"; icon.textContent = nb.icon;
    var h = document.createElement("h3"); h.textContent = nb.name;
    var p = document.createElement("p"); p.textContent = n + (n === 1 ? " note" : " notes");
    b.append(icon, h, p);
    b.onclick = function(){ openNotebook(nb); };
    grid.appendChild(b);
  });
}

/* ---------- Notes pop-up ---------- */
var notesDlg = document.getElementById("notesDlg");
var noteInput = document.getElementById("noteInput");

async function showNotes() {
  var list = document.getElementById("notesList");
  list.innerHTML = "";
  var notes = await notesFor(currentNb.id);
  if (!notes.length) {
    var e = document.createElement("li"); e.className = "empty";
    e.textContent = "No notes yet. Write your first one below 💗";
    list.appendChild(e);
  }
  notes.reverse().forEach(function(n) {
    var li = document.createElement("li"); li.className = "note";
    li.style.setProperty("--c", currentNb.color);
    var box = document.createElement("div");
    box.textContent = n.text;
    var when = document.createElement("small");
    when.textContent = new Date(n.created).toLocaleString();
    box.appendChild(when);
    var del = document.createElement("button");
    del.textContent = "🗑️"; del.setAttribute("aria-label", "Delete note");
    del.onclick = async function(){ await remove("notes", n.id); await showNotes(); refresh(); toast("Note deleted"); };
    li.append(box, del);
    list.appendChild(li);
  });
}
function openNotebook(nb) {
  currentNb = nb;
  document.getElementById("notesTitle").textContent = nb.icon + " " + nb.name;
  noteInput.value = "";
  showNotes();
  notesDlg.showModal();
}
document.getElementById("closeNotes").onclick = function(){ notesDlg.close(); };
document.getElementById("addNote").onclick = async function() {
  var text = noteInput.value.trim();
  if (!text) { toast("Please write something first 💗"); return; }
  await add("notes", {notebookId:currentNb.id, text:text, created:Date.now()});
  noteInput.value = "";
  await showNotes(); refresh(); toast("Note saved ✨");
};

/* ---------- Bottom navigation ---------- */
document.querySelectorAll("#nav button").forEach(function(btn) {
  btn.onclick = function() {
    document.querySelectorAll("#nav button").forEach(function(x){ x.removeAttribute("aria-current"); });
    btn.setAttribute("aria-current", "page");
    if (btn.dataset.page !== "Home") toast(btn.dataset.page + " screen is coming soon ✨");
  };
});

/* ---------- Create New Notebook ---------- */
var dlg = document.getElementById("dlg"), input = document.getElementById("nameInput");
var sw = document.getElementById("swatches");
colors.forEach(function(c) {
  var s = document.createElement("button");
  s.style.setProperty("--c", c);
  s.setAttribute("aria-label", "Colour " + c);
  s.setAttribute("aria-pressed", c === picked);
  s.onclick = function() {
    picked = c;
    sw.querySelectorAll("button").forEach(function(x){ x.setAttribute("aria-pressed", "false"); });
    s.setAttribute("aria-pressed", "true");
  };
  sw.appendChild(s);
});
document.getElementById("newBtn").onclick = function(){ input.value = ""; dlg.showModal(); input.focus(); };
document.getElementById("cancelBtn").onclick = function(){ dlg.close(); };
document.getElementById("saveBtn").onclick = async function() {
  var name = input.value.trim();
  if (!name) { toast("Please type a name first 💗"); return; }
  await add("notebooks", {name:name, icon:"📔", color:picked});
  await refresh(); dlg.close();
  toast("Created “" + name + "” ✨");
};
input.onkeydown = function(e){ if (e.key === "Enter") document.getElementById("saveBtn").click(); };

/* ---------- Start the app ---------- */
(async function start() {
  try {
    db = await openDB();
    await seedIfFirstRun();
    await refresh();
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
  } catch (err) {
    toast("Notes can’t be saved in this browser mode 😢");
  }
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("service-worker.js").catch(function(){});
  }
  window.addEventListener("offline", function(){ toast("You’re offline – your notes still work 📴"); });
  window.addEventListener("online", function(){ toast("Back online 🌐"); });
})();
</script>
</body>
</html>
